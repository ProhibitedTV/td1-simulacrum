[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "td1-simulacrum"
version = "0.1.0a0"
description = "Reference emulator for the TD-1 balanced-ternary experimental computer"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "TD-1 Project"}]
license = {text = "All rights reserved"}

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
