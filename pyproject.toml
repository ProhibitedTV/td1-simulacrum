[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "td1-simulacrum"
version = "0.15.0a0"
description = "Reference emulator and native software environment for the TD-1 balanced-ternary experimental computer"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "TD-1 Project"}]
license = {text = "All rights reserved"}
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
td1-sim = "td1_simulacrum.cli:main"
td1-parity = "td1_simulacrum.campaign_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
td1_simulacrum = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["td1_simulacrum"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
